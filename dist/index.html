<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/Logo-Duqf7Fe6.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval'">
    <title>Stop Saving My Princess</title>
    <style>
      /* ✅ Reset global */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* ✅ Toutes les scènes en position absolue, cachées par défaut */
      .scene {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: none;
        z-index: 100; /* Au-dessus du canvas */
      }

      /* ✅ Quand une scène est active */
      .scene.active {
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000; /* Important pour passer au-dessus */
      }

      #menu-container {
        background:  url('/assets/main_menu-BsYwvZoX.png') center / contain no-repeat;
        background-attachment: fixed;
      }

      /* ✅ Conteneur du jeu */
      #game-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        z-index: 50; /* Plus bas que les menus */
      }

      #game-container.active {
        z-index: 50; /* Reste visible quand actif */
      }

      /* ✅ Canvas container */
      #game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1; /* Au-dessus du fond noir */
      }

      /* ✅ HUD et boutons par-dessus */
      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 100;
        color: white;
        font-family: monospace;
        font-size: 16px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
      }

      #btn-pause {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 100;
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: 2px solid white;
        cursor: pointer;
        border-radius: 5px;
      }

      #btn-pause:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* ✅ Menus et dialogs */
      .menu-content,
      .pause-menu {
        text-align: center;
        color: white;
        padding: 30px;
        border: 2px solid white;
        border-radius: 10px;
        max-width: 600px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      }

      #victory-container {
        background:  url('/assets/ending_image-CWpoObAt.png') center/contain no-repeat;
        background-attachment: fixed;
        align-items: flex-start;
        padding-top: 10px;
      }

      #game-over-container {
        background:  url('/assets/game_over-Bur2G14N.png') center/contain no-repeat;
        background-attachment: fixed;
        align-items: flex-end;
        padding-top: 10px;
      }

      .victory-content,
      .game-over-content {
        text-align: center;
        color: white;
        padding: 20px;
        background: rgba(0, 0, 0, 0.95);
        border: 3px solid gold;
        border-radius: 15px;
        width: 70%;
      }

      .victory-content h1,
      .game-over-content h1 {
        font-size: 64px;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      .victory-content p,
      .game-over-content p {
        font-size: 18px;
        margin: 15px 0;
      }

      h1 {
        margin-bottom: 30px;
        font-size: 48px;
      }

      h2 {
        margin-bottom: 20px;
        font-size: 32px;
      }

      button {
        display: block;
        margin: 10px auto;
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
        background: #333;
        color: white;
        border: 2px solid white;
        border-radius: 5px;
        min-width: 200px;
        transition: background 0.2s;
      }

      button:hover {
        background: #555;
      }

      /* ✅ Options */
      .option {
        margin: 20px 0;
        color: white;
      }

      .option label {
        display: block;
        margin-bottom: 5px;
        font-size: 16px;
      }

      .option input[type="range"] {
        width: 300px;
      }

      .option span {
        display: inline-block;
        margin-left: 10px;
        min-width: 50px;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BoHxr5p2.js"></script>
  </head>
  <body>
    <!-- ✅ Conteneur du jeu (toujours en arrière) -->
    <div id="game-container" class="scene">
      <div id="game-canvas"></div>
      <div id="hud"></div>
      <button id="btn-pause">Pause (ESC)</button>
    </div>

    <!-- ✅ Menu principal -->
    <div id="menu-container" class="scene active">
      <div class="menu-content">
        <button id="btn-new-game">New Game</button>
        <button id="btn-continue">Continue</button>
        <button id="btn-options">Options</button>
        <button id="btn-quit">Quit</button>
      </div>
    </div>

    <!-- ✅ Options -->
    <div id="options-container" class="scene">
      <div class="menu-content">
        <h2>Options</h2>
        
        <div class="option">
          <label for="volume-master">Master Volume</label>
          <input type="range" id="volume-master" min="0" max="100" value="100" />
          <span id="volume-master-value">100%</span>
        </div>
        
        <div class="option">
          <label for="volume-music">Music Volume</label>
          <input type="range" id="volume-music" min="0" max="100" value="70" />
          <span id="volume-music-value">70%</span>
        </div>
        
        <div class="option">
          <label for="volume-sfx">SFX Volume</label>
          <input type="range" id="volume-sfx" min="0" max="100" value="50" />
          <span id="volume-sfx-value">50%</span>
        </div>
        
        <button id="btn-back">Back</button>
      </div>
    </div>

    <!-- ✅ Pause -->
    <div id="pause-container" class="scene">
      <div class="pause-menu">
        <h2>Paused</h2>
        <button id="btn-resume">Resume (ESC)</button>
        <button id="btn-options-pause">Options</button>
        <button id="btn-quit-menu">Main Menu</button>
      </div>
    </div>

    <div id="victory-container" class="scene">
      <div class="victory-content">
        <button id="btn-victory-menu">Return to Menu</button>
      </div>
    </div>

    <div id="game-over-container" class="scene">
      <div class="game-over-content">
        <button id="btn-game-over-menu">Return to Menu</button>
        <button id="btn-game-over-retry">Retry</button>
      </div>
    </div>

  </body>
</html>
