<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stop-saving-my-princess</title>
  </head>
  <body>
    <!-- Main menu -->
    <div id="menu-container" class="scene">
      <div class="menu-content">
        <h1>Stop Saving My Princess</h1>
        <button id="btn-new-game">New Game</button>
        <button id="btn-continue">Continue</button>
        <button id="btn-options">Options</button>
        <button id="btn-quit">Quit</button>
      </div>
    </div>

    <!-- Game  -->
    <div id="game-container" class="scene" style="display: none">
      <canvas id="game-canvas"></canvas>
      <div id="hud"></div>
      <button id="btn-pause">Pause</button>
    </div>

    <!-- Options menu -->
    <div id="options-container" class="scene" style="display: none">
      <h2>Options</h2>

      <div class="option">
        <label for="volume-master">Master Volume</label>
        <input type="range" id="volume-master" min="0" max="100" value="100" />
        <span id="volume-master-value">100%</span>
      </div>

      <div class="option">
        <label for="volume-music">Music Volume</label>
        <input type="range" id="volume-music" min="0" max="100" value="70" />
        <span id="volume-music-value">70%</span>
      </div>

      <div class="option">
        <label for="volume-sfx">SFX Volume</label>
        <input type="range" id="volume-sfx" min="0" max="100" value="50" />
        <span id="volume-sfx-value">50%</span>
      </div>

      <button id="btn-back">Back</button>
    </div>

    <!-- Pause menu -->
    <div id="pause-container" class="scene" style="display: none">
      <div class="pause-menu">
        <h2>Paused</h2>
        <button id="btn-resume">Resume</button>
        <button id="btn-options-pause">Options</button>
        <button id="btn-quit-menu">Main Menu</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
